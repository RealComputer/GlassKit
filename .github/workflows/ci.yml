name: CI

env:
  UV_PYTHON: "3.12"

on:
  pull_request:
    paths:
      - "cli/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
  push:
    branches:
      - main
    paths:
      - "cli/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"

jobs:
  test:
    name: Test CLI package
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: cli

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          working-directory: cli

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --locked --dev

      - name: Verify Python runtime
        run: uv run python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"

      - name: Type check
        run: uv run ty check

      - name: Run tests
        run: uv run pytest

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Smoke test CLI help
        run: |
          uv run glasskit --help
          uv run glasskit eval --help

      - name: Build package
        run: uv build --no-sources --clear
