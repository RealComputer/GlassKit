name: CI

on:
  pull_request:
    paths:
      - "cli/**"
      - "js/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
  push:
    branches:
      - main
    paths:
      - "cli/**"
      - "js/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"

jobs:
  test-cli:
    name: Test CLI package (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    env:
      UV_PYTHON: ${{ matrix.python-version }}

    defaults:
      run:
        working-directory: cli

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: python-${{ matrix.python-version }}
          working-directory: cli

      - name: Install Python
        run: uv python install "${{ matrix.python-version }}"

      - name: Sync dependencies
        run: uv sync --locked --dev

      - name: Verify Python runtime
        run: uv run python -c "import os, sys; expected = tuple(map(int, os.environ['UV_PYTHON'].split('.'))); assert sys.version_info[:2] == expected, sys.version"

      - name: Type check
        run: uv run ty check

      - name: Run tests
        run: uv run pytest

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Smoke test CLI help
        run: |
          uv run glasskit --help
          uv run glasskit eval --help

  test-review-ui:
    name: Test review UI and distributions
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: cli/review-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cli/review-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: package-build
          working-directory: cli

      - name: Install Python
        working-directory: cli
        run: uv python install 3.13

      - name: Build distributions and review UI
        working-directory: cli
        run: uv build --no-sources --clear

      - name: Smoke test built distributions
        working-directory: cli
        run: |
          uv run --isolated --no-project --with dist/*.whl glasskit --help
          uv run --isolated --no-project --with dist/*.tar.gz glasskit --help
          uv run --isolated --no-project --with dist/*.whl python -c "from importlib.resources import files; import re; root = files('glasskit.eval.review').joinpath('static'); source = root.joinpath('index.html').read_text(); refs = re.findall(r'(?:src|href)=\"([^\"]+)\"', source); assert refs and all(root.joinpath(*ref.lstrip('/').split('/')).is_file() for ref in refs), refs"
          uv run --isolated --no-project --with dist/*.tar.gz python -c "from importlib.resources import files; import re; root = files('glasskit.eval.review').joinpath('static'); source = root.joinpath('index.html').read_text(); refs = re.findall(r'(?:src|href)=\"([^\"]+)\"', source); assert refs and all(root.joinpath(*ref.lstrip('/').split('/')).is_file() for ref in refs), refs"

  test-js:
    name: Test JS create package
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: js

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Check package contents
        run: npm pack --dry-run
