[project]
name = "glasskit.ai"
version = "0.1.0"
description = "Recorded-video eval tools for smart-glasses apps"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "RealComputer" },
]
dependencies = [
    "av",
    "pillow",
    "pydantic>=2",
    "pyyaml",
    "rich",
    "typer",
]
keywords = ["ai", "cli", "evals", "smart-glasses", "testing", "video"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://glasskit.ai"
Documentation = "https://github.com/RealComputer/GlassKit/blob/main/cli/README.md"
Repository = "https://github.com/RealComputer/GlassKit"
Issues = "https://github.com/RealComputer/GlassKit/issues"

[project.scripts]
glasskit = "glasskit.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "glasskit"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
